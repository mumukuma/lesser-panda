name: Build & Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Verify data & i18n (gate — bad data stops the deploy)
        run: |
          bash tools/verify.sh
          python tools/check_i18n.py
          node web/tests/closed.test.mjs

      - name: Build data pipeline (wiki → SQLite → JSON)
        run: |
          python tools/build_db.py
          python pipeline/scripts/export_json.py

      - name: Build Astro site
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 首次執行時自動建立 Pages 專案（已存在則略過）
          npx wrangler@4 pages project create ressapanda --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy web/dist --project-name=ressapanda --branch=main --commit-dirty=true
